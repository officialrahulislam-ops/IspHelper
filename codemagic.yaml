workflows:
  android_build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    script:
      - flutter pub get
      - flutter build apk --release --build-name=${CM_BUILD_NUMBER} --build-number=${CM_BUILD_NUMBER}
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk